[package]
name = "radar"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native workspace manager: projects in a sidebar, tools in tabs"
license = "MIT"

[[bin]]
name = "radar"
path = "src/main.rs"

[[example]]
name = "vte_probe"
required-features = ["vte"]

[[example]]
name = "keys_probe"
required-features = ["vte"]

[features]
default = []
# `gui` builds the app with GTK4 + libadwaita (already installed on omarchy).
# `vte` adds embedded terminals via libvte-2.91-gtk4 (Arch: `vte4`). Without it
# every tab still works, but programs open in their own terminal window instead
# of inside radar.
gui = ["dep:gtk", "dep:adw"]
vte = ["gui", "dep:vte4"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
fuzzy-matcher = "0.3"
walkdir = "2"
vte4 = { version = "0.7", optional = true }
gtk = { package = "gtk4", version = "0.8", optional = true, features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.6", optional = true, features = ["v1_5", "gtk_v4_10"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
