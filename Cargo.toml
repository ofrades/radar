[package]
name = "radar"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Project-first workspace: human overview at Home, tools on demand"
license = "MIT"

[[bin]]
name = "radar"
path = "src/main.rs"

[[example]]
name = "ghostty_probe"
required-features = ["gui"]

[features]
default = []
# `gui` builds the app with GTK4 + libadwaita (already installed on omarchy).
# The terminal engine is libghostty-vt, built unconditionally by `build.rs`.
gui = ["dep:gtk", "dep:adw"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
parking_lot = "0.12"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
dirs = "5"
fuzzy-matcher = "0.3"
walkdir = "2"
libc = "0.2"
async-channel = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
portable-pty = "0.9"
gtk = { package = "gtk4", version = "0.8", optional = true, features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.6", optional = true, features = ["v1_5", "gtk_v4_10"] }
agent-client-protocol = "2.2"
futures-lite = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
