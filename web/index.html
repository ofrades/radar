<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111311" />
    <title>Radar Remote</title>
    <base href="/" />
    <script>
      const pagePath = location.pathname;
      document.querySelector("base").href = pagePath.endsWith("/") ? pagePath : `${pagePath}/`;
    </script>
    <link rel="stylesheet" href="assets/xterm.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <script type="module" src="assets/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#/" aria-label="Radar home">
          <span class="brand-mark">◉</span>
          <span>radar</span>
          <span class="remote-tag">REMOTE</span>
        </a>
        <div class="top-actions">
          <span class="connection-dot" id="server-state" aria-label="Checking server"></span>
          <button class="small-button hidden" id="attention-shortcut" type="button">Needs attention</button>
          <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh workspace" title="Refresh">↻</button>
        </div>
      </header>

      <main class="main-content" id="main" aria-live="polite"></main>

      <section id="terminal-view" class="terminal-view hidden" aria-label="Remote terminal">
        <div class="terminal-toolbar">
          <button class="back-button" id="back-button" type="button"><span>‹</span> Back</button>
          <button class="small-button hidden" id="terminal-attention-shortcut" type="button">Needs attention</button>
          <div class="terminal-heading">
            <strong id="terminal-title">Terminal</strong>
            <span id="terminal-connection">Connecting…</span>
          </div>
          <button class="icon-button" id="reconnect-button" type="button" aria-label="Reconnect terminal" title="Reconnect">↻</button>
          <button class="icon-button" id="detach-button" type="button" aria-label="Detach terminal" title="Detach">⤢</button>
        </div>
        <div class="terminal-frame">
          <div id="terminal" class="terminal"></div>
        </div>
        <nav class="terminal-keys" aria-label="Terminal keys">
          <button type="button" data-key="esc">Esc</button>
          <button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="ctrl-c">Ctrl+C</button>
          <button type="button" data-key="ctrl-d">Ctrl+D</button>
          <button type="button" data-key="up" aria-label="Up">↑</button>
          <button type="button" data-key="down" aria-label="Down">↓</button>
          <button type="button" data-key="left" aria-label="Left">←</button>
          <button type="button" data-key="right" aria-label="Right">→</button>
        </nav>
      </section>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
  </body>
</html>
